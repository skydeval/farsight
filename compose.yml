# Farsight deployment: server, backfill worker, Postgres.
# Quick start: docker compose up -d, open http://<host>:8080,
# get the setup token with: docker logs farsight
#
# POSTGRES_PASSWORD belongs in a file named .env beside this one, which
# compose reads on every command. Exported in one shell only, it is
# missing in the next, and the server is then started with a connection
# string Postgres refuses. Letters and digits only: it is part of a URL.
#
# Disk: the farsight-pgdata volume holds the index. Plan for roughly
# 30-56 GB after the first full sweep plus 18-20 GB/year of growth;
# 500 GB is recommended. See docs/guide/storage.md.

name: farsight

x-farsight-common: &farsight-common
  # The tag is the version this file belongs to, never `latest`: a pull
  # gets the release the checkout describes, not whatever was published
  # last. Until an image is published, compose builds it from this
  # checkout and gives it this name.
  image: ghcr.io/skydeval/farsight:0.6.1
  build: .
  restart: unless-stopped
  user: "10001:10001"
  env_file:
    - path: farsight.env
      required: false
  environment:
    FARSIGHT__STORAGE__DATABASE_URL: postgres://farsight:${POSTGRES_PASSWORD:-farsight}@postgres:5432/farsight
    # Metrics listen on loopback unless told otherwise. Here the ports are
    # not published, so every interface means the compose network.
    FARSIGHT__METRICS__BIND: 0.0.0.0:9464
    FARSIGHT__METRICS__BACKFILL_BIND: 0.0.0.0:9465
  # Both processes take up to 40 s to stop: they finish the batch in hand
  # and give back the work they hold. Every step of it has a deadline.
  stop_grace_period: 45s
  depends_on:
    postgres:
      condition: service_healthy

services:
  farsight:
    <<: *farsight-common
    container_name: farsight
    command: ["farsight"]
    ports:
      # Only the web port is published. Set FARSIGHT_PORT to change the host
      # side, e.g. FARSIGHT_PORT=127.0.0.1:8080 for SSH-tunnel setup.
      - "${FARSIGHT_PORT:-8080}:8080"
    volumes:
      - farsight-config:/etc/farsight
    healthcheck:
      # 200 when the firehose is connected and the database answers.
      # Status only; compose does not restart on unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  farsight-backfill:
    <<: *farsight-common
    container_name: farsight-backfill
    # Idles until the setup wizard has written the config, then waits for
    # the server's migrations. Metrics on :9465 inside the network only.
    command: ["farsight-backfill"]
    volumes:
      - farsight-config:/etc/farsight:ro

  postgres:
    image: postgres:16
    container_name: farsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farsight}
      POSTGRES_DB: farsight
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      # Hot tables churn constantly: vacuum and analyze sooner.
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    volumes:
      - farsight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farsight -d farsight"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  farsight-config:
  farsight-pgdata:
