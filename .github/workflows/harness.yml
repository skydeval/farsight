name: harness

# Runs the integration harnesses: the feature-gated binaries that drive
# real `farsight` processes against a throwaway Postgres and read the
# stored rows and the responses back, and the ingest harness, which reads
# the public Jetstream into one. ci.yml compiles and lints them on every
# push; this workflow runs them every night and on request.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every action is named by the commit it runs, with the tag that commit
# was read from in a comment (see ci.yml).

# One run at a time: a run started while another is in progress waits for it.
concurrency:
  group: harness
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HARNESS_FEATURES: farsight-storage/harness,farsight-ingest/harness,farsight-api/harness,farsight-server/harness,farsight-backfill/harness
  # Pulled before a harness starts, so that a slow or failed pull shows as
  # its own step. The harnesses name the same images in their sources.
  POSTGRES_IMAGE: postgres:16
  BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.48.0-jammy
  # The stage 3 harness names this image, digest included, in its source.
  BUSYBOX_IMAGE: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

jobs:
  # Builds every binary once, with the harness features, and hands the ones
  # the stages run to them as one artifact. A harness starts `farsight`
  # from its own directory, and that `farsight` must be the one built with
  # the harness features, so the binaries travel together.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Enough for a backtrace with line numbers, and binaries a fraction
      # of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: harness
      - run: cargo build --locked --workspace --bins --features "$HARNESS_FEATURES"
      - name: Pack the binaries
        run: |
          set -euo pipefail
          cd target/debug
          tar -cf "$RUNNER_TEMP/harness-binaries.tar.zst" -I 'zstd -T0 -3' \
            farsight farsight-backfill farsight-ingest-harness \
            farsight-stage1-harness farsight-stage3-harness \
            farsight-stage4-harness farsight-stage5-harness \
            farsight-stage6-harness farsight-stage7-harness \
            farsight-stage8-harness farsight-stage9-harness
          ls -l "$RUNNER_TEMP/harness-binaries.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-binaries
          path: ${{ runner.temp }}/harness-binaries.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  stage:
    name: stage ${{ matrix.stage }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pass` is the line a successful run prints last; `args` are the
          # harness's own flags (see the module docs of each main.rs).
          # `unverified` is the number of checks those flags leave out: a
          # run that reports more did not check what it is here to check,
          # and fails. `bin` is the binary's name.
          - stage: 1
            bin: farsight-stage1-harness
            args: ""
            pass: '^ALL STREAMS PASSED$'
            unverified: 0
            browser: false
          # The first phase of stage 3 runs ingest on the public Jetstream;
          # the harness has no flag that leaves it out.
          - stage: 3
            bin: farsight-stage3-harness
            args: ""
            pass: '^RESULT: PASS '
            unverified: 0
            browser: false
          # --skip-live: check 11 needs a v2 Jetstream on this machine.
          - stage: 4
            bin: farsight-stage4-harness
            args: "--skip-live"
            pass: '^== summary: [0-9]+ passed, 0 failed, '
            unverified: 1
            browser: false
          - stage: 5
            bin: farsight-stage5-harness
            args: ""
            pass: '^RESULT: PASS '
            unverified: 0
            browser: false
          # --skip-live: no real handle, no real account's card.
          - stage: 6
            bin: farsight-stage6-harness
            args: "--skip-live --browser"
            pass: '^RESULT: PASS '
            unverified: 4
            browser: true
          - stage: 7
            bin: farsight-stage7-harness
            args: "--browser"
            pass: '^RESULT: PASS '
            unverified: 2
            browser: true
          # --skip-live: no handles from the real PLC directory and DNS.
          - stage: 8
            bin: farsight-stage8-harness
            args: "--skip-live --browser"
            pass: '^RESULT: PASS '
            unverified: 2
            browser: true
          - stage: 9
            bin: farsight-stage9-harness
            args: "--browser"
            pass: '^RESULT: PASS '
            unverified: 0
            browser: true
          # The ingest harness: real Jetstream into a real Postgres, with
          # an independent reference connection. Mode a is the bounded
          # conformance run. It is the only run of the gap and seam
          # checks.
          - stage: ingest
            bin: farsight-ingest-harness
            args: "--mode a --minutes 8"
            pass: '^RESULT: PASS '
            unverified: 0
            browser: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harness-binaries
          path: ${{ runner.temp }}
      - name: Unpack the binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xf "$RUNNER_TEMP/harness-binaries.tar.zst" -I zstd -C "$RUNNER_TEMP/bin"
          rm "$RUNNER_TEMP/harness-binaries.tar.zst"
          chmod +x "$RUNNER_TEMP"/bin/*
      - name: Pull the Postgres image
        run: docker pull --quiet "$POSTGRES_IMAGE"
      # Stage 3 sends requests from a busybox container on a network of
      # its own.
      - name: Pull busybox
        if: matrix.stage == 3
        run: docker pull --quiet "$BUSYBOX_IMAGE"
      - name: Pull the browser image
        if: matrix.browser
        run: docker pull --quiet "$BROWSER_IMAGE"
      - name: Run the stage ${{ matrix.stage }} harness
        timeout-minutes: 25
        env:
          STAGE: ${{ matrix.stage }}
          BIN: ${{ matrix.bin }}
          ARGS: ${{ matrix.args }}
          PASS: ${{ matrix.pass }}
          MAX_UNVERIFIED: ${{ matrix.unverified }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          log="$RUNNER_TEMP/logs/stage$STAGE.log"
          # The exit code is the verdict: 0 only when no check failed
          # (stage 1: only when every check passed), 2 when Postgres or a
          # Docker network could not be started.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/bin/$BIN" $ARGS 2>&1 | tee "$log"
          # And the run must have reached its verdict line.
          grep -Eq "$PASS" "$log" || {
            echo "::error::stage $STAGE exited 0 without its pass line"
            exit 1
          }
          # A verdict with counts must have passed something, and may
          # leave unverified only what the flags above explain: a run of
          # nothing but unverified checks has failed no check and has
          # proved nothing.
          verdict="$(grep -E '^(RESULT: |== summary: )' "$log" | tail -n 1 || true)"
          if [ -n "$verdict" ]; then
            passed="$(printf '%s\n' "$verdict" | sed -nE 's/.*[^0-9]([0-9]+) passed.*/\1/p')"
            unverified="$(printf '%s\n' "$verdict" | sed -nE 's/.*[^0-9]([0-9]+) unverified.*/\1/p')"
            if [ -z "$passed" ] || [ -z "$unverified" ]; then
              echo "::error::stage $STAGE: no counts in its verdict line: $verdict"
              exit 1
            fi
            if [ "$passed" -eq 0 ]; then
              echo "::error::stage $STAGE passed no check"
              exit 1
            fi
            if [ "$unverified" -gt "$MAX_UNVERIFIED" ]; then
              echo "::error::stage $STAGE left $unverified checks unverified; its flags explain $MAX_UNVERIFIED"
              exit 1
            fi
          fi
      - name: Summary
        if: always()
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          log="$RUNNER_TEMP/logs/stage$STAGE.log"
          {
            echo "### Stage $STAGE"
            echo '```'
            if [ -s "$log" ]; then
              grep -E '^(RESULT: |== summary: |ALL STREAMS PASSED|NOT ALL STREAMS PASSED)' "$log" || echo "no verdict line; see the log"
              grep -E '(FAIL|UNVERIFIED)' "$log" | grep -Ev '^(RESULT: |NOT ALL STREAMS PASSED)' | head -n 60 || true
            else
              echo "the harness did not run"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The servers a harness started log into directories under the
      # temporary directory, and the browser container leaves npm.log there.
      - name: Collect the server logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for f in "${TMPDIR:-/tmp}"/farsight-stage*/*.log; do
            [ -f "$f" ] || continue
            d="$RUNNER_TEMP/logs/$(basename "$(dirname "$f")")"
            mkdir -p "$d"
            cp "$f" "$d/" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage${{ matrix.stage }}-log
          path: ${{ runner.temp }}/logs
          retention-days: 14
          if-no-files-found: warn
