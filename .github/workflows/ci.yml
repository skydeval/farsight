name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is named by the commit it runs, with the tag that commit
# was read from in a comment: a tag can be moved, a commit cannot.
# `dtolnay/rust-toolchain` is pinned on its `stable` branch, whose action
# installs the stable toolchain; `toolchain: stable` says so here too.

env:
  CARGO_TERM_COLOR: always
  HARNESS_FEATURES: farsight-storage/harness,farsight-ingest/harness,farsight-api/harness,farsight-server/harness,farsight-backfill/harness

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The integration harnesses are binaries behind the `harness`
      # features. They are linted and built here and not run: the nightly
      # workflow (harness.yml) runs them.
      - run: cargo clippy --locked --workspace --all-targets --features "$HARNESS_FEATURES" -- -D warnings
      - run: cargo build --locked --workspace --bins --features "$HARNESS_FEATURES"
      - run: cargo test --locked --workspace

  # Advisories, licences, banned and duplicated crates, and where crates
  # come from, as deny.toml sets them.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  # Line coverage of the unit tests, printed in the job's log and its
  # summary. Nothing is sent anywhere.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage
      - name: Run the tests with coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --workspace --no-report
          cargo llvm-cov report --summary-only | tee coverage.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Unit test coverage"
            echo '```'
            if [ -s coverage.txt ]; then cat coverage.txt; else echo "no coverage report was produced"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
