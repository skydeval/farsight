name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Phase B harnesses are feature-gated; compile and lint them too (not run).
      - run: cargo clippy --workspace --all-targets --features farsight-storage/harness,farsight-ingest/harness,farsight-api/harness,farsight-server/harness,farsight-backfill/harness -- -D warnings
      - run: cargo test --workspace
