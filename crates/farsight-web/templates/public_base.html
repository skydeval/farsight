<!doctype html>
<html lang="en"{% if c.theme != "system" %} data-theme="{{ c.theme }}"{% endif %} data-theme-default="{{ c.theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090c15">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>Farsight</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ crate::common::asset_version() }}">
{{ c.og|safe }}
<link rel="stylesheet" href="/static/public.css?v={{ crate::common::asset_version() }}">
<script src="/static/public.js?v={{ crate::common::asset_version() }}"></script>
<script src="/static/htmx.min.js?v={{ crate::common::asset_version() }}" defer></script>
</head>
<body>
{% include "_public_nav.html" %}
<main>
{% block content %}{% endblock %}
</main>
<footer>
<div class="footer-inner">
  <div class="footer-brand">
    {% block updated %}{% endblock %}
    <p>An independent index of public block records, run by its operator and not affiliated with Bluesky.</p>
  </div>
  <div class="footer-hints">
    <span class="keyboard-hint"><kbd>/</kbd> Focus search</span>
    <span class="keyboard-hint"><kbd>Esc</kbd> Close overlays</span>
  </div>
</div>
</footer>
</body>
</html>
