<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Farsight{% endblock %}</title>
<link rel="stylesheet" href="/static/farsight.css">
<script src="/static/public.js" defer></script>
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
<span class="brand">Farsight</span>
{% if nav.admin %}
<nav>
<a href="/admin">Dashboard</a>
<a href="/admin/lookup/did">DID lookup</a><a href="/admin/lookup/list">List lookup</a>
<a href="/admin/ops">Operations</a><a href="/admin/settings">Settings</a>
</nav>
<span style="margin-left:auto">
<form method="post" action="/admin/logout" style="display:inline"><input type="hidden" name="csrf" value="{{ nav.csrf }}"><button class="secondary" type="submit">Log out</button></form>
</span>
{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
