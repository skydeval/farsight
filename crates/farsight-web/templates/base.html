<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Farsight{% endblock %}</title>
<link rel="stylesheet" href="/static/farsight.css?v={{ crate::common::asset_version() }}">
<script src="/static/public.js?v={{ crate::common::asset_version() }}" defer></script>
<script src="/static/htmx.min.js?v={{ crate::common::asset_version() }}" defer></script>
</head>
<body>
<header class="top">
<span class="brand">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 12l7-7"/><circle cx="12" cy="12" r="2"/></svg>
<span>Farsight</span>
</span>
{% if nav.admin %}
<nav>
<a href="/admin">Dashboard</a>
<a href="/admin/lookup/did">DID lookup</a><a href="/admin/lookup/list">List lookup</a>
<a href="/admin/ops">Operations</a><a href="/admin/settings">Settings</a>
</nav>
<span style="margin-left:auto; display:flex; gap:0.75rem; align-items:center;">
<div class="theme-toggle" role="group" aria-label="Theme" hidden>
<button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="false" title="Light">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<button type="button" data-theme-choice="dark" aria-label="Dark theme" aria-pressed="false" title="Dark">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<button type="button" data-theme-choice="system" aria-label="System theme" aria-pressed="false" title="System">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/></svg>
</button>
</div>
<form method="post" action="/admin/logout" style="display:inline"><input type="hidden" name="csrf" value="{{ nav.csrf }}"><button class="secondary" type="submit">Log out</button></form>
</span>
{% else %}
<span style="margin-left:auto; display:flex; gap:0.75rem; align-items:center;">
<div class="theme-toggle" role="group" aria-label="Theme" hidden>
<button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="false" title="Light">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<button type="button" data-theme-choice="dark" aria-label="Dark theme" aria-pressed="false" title="Dark">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<button type="button" data-theme-choice="system" aria-label="System theme" aria-pressed="false" title="System">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/></svg>
</button>
</div>
</span>
{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
