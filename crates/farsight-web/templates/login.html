{% extends "base.html" %}
{% block title %}Farsight — log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if let Some(e) = error %}<div class="banner bad">{{ e }}</div>{% endif %}
<form class="stack card" method="post" action="/enter">
<label for="password">Admin password</label>
<input type="password" id="password" name="password" autocomplete="current-password" autofocus>
<div class="row"><button type="submit">Log in</button></div>
</form>
{% endblock %}
