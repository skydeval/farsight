[package]
name = "farsight-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
# Builds the stage-3, stage-5, stage-6, stage-7, stage-8 and stage-9
# harness binaries and the API's harness hooks.
# Off by default so release builds contain neither.
harness = [
    "farsight-api/harness",
    "farsight-storage/harness",
    "farsight-web/harness",
    "dep:ring",
    "dep:sha2",
    "dep:base64",
]

[[bin]]
name = "farsight"
path = "src/main.rs"

[[bin]]
name = "farsight-stage3-harness"
path = "src/bin/stage3_harness/main.rs"
required-features = ["harness"]

[[bin]]
name = "farsight-stage5-harness"
path = "src/bin/stage5_harness/main.rs"
required-features = ["harness"]

[[bin]]
name = "farsight-stage6-harness"
path = "src/bin/stage6_harness/main.rs"
required-features = ["harness"]

[[bin]]
name = "farsight-stage7-harness"
path = "src/bin/stage7_harness/main.rs"
required-features = ["harness"]

[[bin]]
name = "farsight-stage8-harness"
path = "src/bin/stage8_harness/main.rs"
required-features = ["harness"]

[[bin]]
name = "farsight-stage9-harness"
path = "src/bin/stage9_harness/main.rs"
required-features = ["harness"]

[dependencies]
base64 = { version = "0.22", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono.workspace = true
farsight-api = { path = "../farsight-api" }
farsight-core.workspace = true
farsight-ingest = { path = "../farsight-ingest" }
farsight-storage = { path = "../farsight-storage" }
farsight-web = { path = "../farsight-web" }
getrandom = "0.2"
ipnet.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
ring = { version = "0.17", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
sqlx.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }

[lints]
workspace = true
