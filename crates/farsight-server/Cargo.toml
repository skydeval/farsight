[package]
name = "farsight-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
# Builds the stage-3 Phase B harness binary and the API's harness hooks.
# Off by default so release builds contain neither.
harness = ["farsight-api/harness", "farsight-storage/harness"]

[[bin]]
name = "farsight"
path = "src/main.rs"

[[bin]]
name = "farsight-stage3-harness"
path = "src/bin/stage3_harness/main.rs"
required-features = ["harness"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono.workspace = true
farsight-api = { path = "../farsight-api" }
farsight-core.workspace = true
farsight-ingest = { path = "../farsight-ingest" }
farsight-storage = { path = "../farsight-storage" }
farsight-web = { path = "../farsight-web" }
getrandom = "0.2"
ipnet.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde_json.workspace = true
sqlx.workspace = true
subtle = "2.6"
tokio = { workspace = true, features = ["signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }

[lints]
workspace = true
