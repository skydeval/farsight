[package]
name = "farsight-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
# Harness-only hooks (artificially slow queries for the semaphore and
# timeout checks). Off by default so release builds never contain them.
harness = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri"] }
base64 = "0.22"
chrono.workspace = true
farsight-core.workspace = true
farsight-ingest = { path = "../farsight-ingest" }
farsight-storage = { path = "../farsight-storage" }
getrandom = "0.2"
ipnet.workspace = true
metrics = "0.24"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
toml.workspace = true
tracing = "0.1"
url.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
